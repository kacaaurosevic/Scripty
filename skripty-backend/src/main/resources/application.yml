spring:
  application:
    name: skripty-backend

  # Lokalno: učitaj tajne iz .env fajla u root folderu projekta.
  # "optional" znači da na Render-u (gde nema .env) ne pravi grešku.
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:skripty}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}

# Custom app properties — all secrets come from environment variables, never hardcoded
skripty:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000   # 24h
  gemini:
    api-key: ${GEMINI_API_KEY}
    model: gemini-3.5-flash-lite
    fallback-model: gemini-3.8-flash
    base-url: https://generativelanguage.googleapis.com/v1beta
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
